<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="みこる🌻朝活と断捨離">
<meta name="theme-color" content="#fbf7ec">
<title>みこる🌻朝活と断捨離～ごきげんな毎日へ～</title>
<style>
:root{
  --bg:#fbf7ec; --card:#fffdf6; --ink:#3b3a2f; --muted:#8a8670; --line:#ece4cc;
  --olive:#6f8f72; --olive-dk:#4d6b50; --olive-lt:#e4ecdc;
  --sun:#f4c542; --sun-lt:#fdf1c8; --soil:#e6d8b8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  line-height:1.6}
body{padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 84px);max-width:560px;margin:0 auto}
h1{font-size:15px;margin:6px 0 10px;color:var(--olive-dk);letter-spacing:.04em;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 8px;color:var(--olive-dk);font-weight:600}
.datebar{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.datebar .t{font-size:17px;font-weight:600}
.datebar .t small{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px;color:var(--olive-dk)}
.iconbtn:disabled{opacity:.3}
.tree{width:min(260px,70%);display:block;margin:0 auto}
.cap{text-align:center;font-size:13px;color:var(--muted);margin:2px 0 12px}
.cap b{color:var(--olive-dk);font-size:15px}
button{font-family:inherit}
.big{width:100%;border:0;border-radius:16px;padding:15px;font-size:17px;font-weight:600;color:#fff;background:var(--olive)}
.big.sun{background:var(--sun);color:#4a3c0a}
.big:active{transform:scale(.99)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font-size:15px;color:var(--ink)}
.chip.on{background:var(--olive-lt);border-color:var(--olive);color:var(--olive-dk)}
.chip.pick{background:var(--olive-lt);border-color:var(--olive)}
input[type=text],input[type=search],input[type=time],textarea{
  width:100%;font-size:16px;font-family:inherit;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;color:var(--ink)}
textarea{min-height:76px;resize:vertical}
.row2{display:flex;gap:8px;margin-top:8px}
.row2 .grow{flex:1}
.small{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-size:14px;color:var(--olive-dk)}
.small.pri{background:var(--olive);border-color:var(--olive);color:#fff}
.linkbtn{background:none;border:0;color:var(--muted);font-size:13px;padding:8px 4px;text-decoration:underline}
.done{background:var(--olive-lt);border-radius:14px;padding:12px 14px;font-size:15px}
.field{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.flowers{display:flex;flex-wrap:wrap;gap:2px;min-height:34px;margin:2px 0 12px;font-size:23px;line-height:1.25}
.flowers .empty{font-size:13px;color:var(--muted)}
.flowers span.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.2) rotate(-40deg);opacity:0}70%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
.total{text-align:center}
.total .n{font-size:44px;font-weight:700;color:var(--olive-dk);line-height:1.1}
.total .n small{font-size:15px;font-weight:500;margin-left:4px}
.total .s{font-size:12px;color:var(--muted)}
.tdlist{margin-top:10px}
.tditem{display:flex;align-items:center;gap:6px;padding:6px 0;border-top:1px dashed var(--line);font-size:15px}
.tditem .tx{flex:1;word-break:break-all}
.tditem .x{border:0;background:none;color:var(--muted);font-size:20px;width:36px;height:36px}
details{border-top:1px solid var(--line)}
details summary{list-style:none;padding:12px 2px;font-size:14px;color:var(--olive-dk);font-weight:600;cursor:pointer}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ ";color:var(--muted)}
details[open] summary::before{content:"▾ "}
.lab{font-size:12px;color:var(--muted);margin:12px 0 4px}
.seg{display:flex;gap:6px;align-items:center}
.seg .nm{width:2.2em;font-size:13px;color:var(--muted)}
.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 0;font-size:14px;color:var(--ink)}
.seg button.on{background:var(--olive-lt);border-color:var(--olive);color:var(--olive-dk);font-weight:600}
.times{display:flex;gap:10px}.times>div{flex:1}
input[type=date],input[type=number]{width:100%;font-size:16px;font-family:inherit;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;color:var(--ink)}
.ch-main{font-size:22px;color:var(--ink)}
.ch-main b{font-size:40px;color:var(--olive-dk);font-weight:700;margin:0 2px}
.ch-sub{font-size:13px;color:var(--muted);margin-top:2px}
.ch-bar{height:10px;background:var(--sun-lt);border-radius:999px;margin-top:12px;overflow:hidden}
.ch-bar>div{height:100%;background:var(--sun);border-radius:999px}
.sleepinfo{margin-top:10px;font-size:14px}
.sl-dur{font-size:22px;font-weight:700;color:var(--olive-dk)}
.sl-ok{margin-left:10px;font-size:13px;color:var(--olive-dk);background:var(--olive-lt);border-radius:999px;padding:3px 10px}
.sl-week{margin-top:6px;font-size:13px;color:var(--muted)}
.sl-week b{color:var(--olive-dk)}
.sv-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.sv-h{font-size:12px;color:var(--olive-dk);font-weight:600;border-bottom:1px solid var(--line);padding-bottom:4px}
.sv-k{font-size:11px;color:var(--muted);margin-top:8px}
.sv-v{font-size:20px;font-weight:700;color:var(--ink);line-height:1.2}
.sv-v small{font-size:12px;font-weight:500;color:var(--muted);margin-left:2px}
.sv-note{margin-top:12px;font-size:14px;background:var(--olive-lt);border-radius:12px;padding:9px 12px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,246,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);z-index:5}
.tabs .in{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;background:none;border:0;padding:6px 0;font-size:11px;color:var(--muted)}
.tabs button .e{display:block;font-size:22px;line-height:1.2}
.tabs button.on{color:var(--olive-dk);font-weight:700}
.mh{display:flex;align-items:center;justify-content:space-between;margin:16px 0 4px}
.mh b{font-size:15px;color:var(--olive-dk)}
.lrow{display:flex;gap:10px;padding:9px 0;border-top:1px dashed var(--line);font-size:15px;align-items:center}
.lrow .d{width:3.6em;color:var(--muted);font-size:13px;flex:none}
.lrow .tx{flex:1;word-break:break-all}
.lrow .x{border:0;background:none;color:var(--muted);font-size:20px;width:36px;height:36px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid .cell{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 6px;text-align:center}
.grid .cell svg{width:100%;display:block}
.grid .cell .l{font-size:13px;color:var(--olive-dk);font-weight:600}
.grid .cell .l small{color:var(--muted);font-weight:400}
.hint{font-size:13px;color:var(--muted)}
.warn{background:#fdeaea;border:1px solid #e9b5b5;border-radius:14px;padding:12px;font-size:14px;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:#3b3a2f;color:#fff;
  padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9;max-width:90%}
#toast.show{opacity:.95}
</style>
</head>
<body>
<div id="app"></div>
<div class="tabs"><div class="in" id="tabs"></div></div>
<div id="toast"></div>

<script>
"use strict";
/* ===== 保存データ =====
   キーは旧アプリと同じ。日付キー → 1日分の記録。
   旧フィールド(wake/bed/work/m/a/n/parts/memo/dayType/noon/night/morning)には触れず、
   新しい記録は asa(朝活) と items(整えたもの) として同じ日の記録に追加する。 */
const KEY = "body-sleep-log-v2";
const BACKUP_KEY = KEY + "-backup-20261013";
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
let db = {}, canSave = true, loadErr = "";

(function init(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); }
  catch(e){ canSave = false; loadErr = "この画面ではデータを保存できません。ホーム画面のアイコンから開いてください。"; return; }
  if (raw) {
    try {
      const o = JSON.parse(raw);
      if (!o || typeof o !== "object" || Array.isArray(o)) throw new Error("shape");
      db = o;
      try { if (localStorage.getItem(BACKUP_KEY) === null) localStorage.setItem(BACKUP_KEY, raw); } catch(e){}
    } catch(e){
      canSave = false;
      loadErr = "保存データを読み込めませんでした。データを守るため、保存を止めています。";
    }
  }
})();

function save(){
  if (!canSave) return false;
  try { localStorage.setItem(KEY, JSON.stringify(db)); return true; }
  catch(e){ toast("保存に失敗しました"); return false; }
}
function edit(date, fn){
  if (!canSave){ toast(loadErr || "保存できません"); return false; }
  const r = db[date] || (db[date] = {});
  fn(r);
  if (Object.keys(r).length === 0) delete db[date];
  return save();
}

/* ===== 日付 ===== */
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const WD = ["日","月","火","水","木","金","土"];
const todayKey = () => ymd(new Date());
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ===== 集計 ===== */
const dateKeys = () => Object.keys(db).filter(k => DATE_RE.test(k) && db[k] && typeof db[k] === "object");
const asaDays = mk => dateKeys().filter(k => k.startsWith(mk) && db[k].asa).length;
function allItems(){
  const out = [];
  dateKeys().sort().forEach(k => {
    (Array.isArray(db[k].items) ? db[k].items : []).forEach(it => out.push({date:k, id:it.id, t:it.t||"", at:it.at||0}));
  });
  return out;
}

/* ===== オリーブの木(SVG) ===== */
const STAGES = [[0,"種"],[1,"芽"],[5,"苗"],[10,"若木"],[15,"大木"],[20,"実のなる木"]];
function stageOf(days){
  let i = 0;
  for (let k = 0; k < STAGES.length; k++) if (days >= STAGES[k][0]) i = k;
  return i;
}
function rng(s){ s = (s % 2147483646) + 1; return () => (s = s * 16807 % 2147483647) / 2147483647; }
function mixHex(c1, c2, t){
  const p = h => [1,3,5].map(i => parseInt(h.substr(i,2),16));
  const a = p(c1), b = p(c2);
  return "#" + [0,1,2].map(i => Math.round(a[i]+(b[i]-a[i])*t).toString(16).padStart(2,"0")).join("");
}
const LEAF = ["#8fa88c","#a9bda5","#728f76","#b7c8b0"];
function leaf(x,y,rot,sc,col){
  return '<ellipse cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" rx="'+(11*sc).toFixed(1)+'" ry="'+(3.8*sc).toFixed(1)+
    '" fill="'+col+'" transform="rotate('+rot.toFixed(0)+' '+x.toFixed(1)+' '+y.toFixed(1)+')"/>';
}
function treeSVG(days, seed){
  const G = 206, r = rng((seed||1) * 7919 + 13);
  let s = '<ellipse cx="100" cy="'+G+'" rx="72" ry="9" fill="#e6d8b8"/>';
  const wrap = body => '<svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="オリーブの木">'+body+'</svg>';
  if (days <= 0){
    s += '<ellipse cx="100" cy="'+(G-5)+'" rx="8" ry="5.5" fill="#8a6a45"/>'+
         '<path d="M95 '+(G-6)+' Q100 '+(G-11)+' 105 '+(G-6)+'" stroke="#a98a62" stroke-width="1.5" fill="none"/>';
    return wrap(s);
  }
  const trunk = (bw, tw, topY, col) =>
    '<path d="M'+(100-bw)+' '+G+' Q'+(100-tw-3)+' '+((G+topY)/2)+' '+(100-tw)+' '+topY+
    ' L'+(100+tw)+' '+topY+' Q'+(100+tw+3)+' '+((G+topY)/2)+' '+(100+bw)+' '+G+' Z" fill="'+(col||"#8a6f50")+'"/>';
  const branch = (x1,y1,x2,y2,w) =>
    '<path d="M'+x1+' '+y1+' Q'+((x1+x2)/2+(x2<x1?-4:4))+' '+((y1+y2)/2+2)+' '+x2+' '+y2+'" stroke="#7a6247" stroke-width="'+w+'" stroke-linecap="round" fill="none"/>';
  let cy, rx, ry, n;
  if (days < 5){
    const h = 34 + days * 9; cy = G - h;
    s += '<path d="M100 '+G+' L100 '+(cy+4)+'" stroke="#7d8a58" stroke-width="3.5" stroke-linecap="round" fill="none"/>';
    const cnt = days * 2 + 1;
    for (let i = 0; i < cnt; i++){
      const side = i % 2 ? 1 : -1, k = Math.floor(i/2);
      s += leaf(100 + side*9, cy + k*9, side * -28, 1, LEAF[(i+1)%LEAF.length]);
    }
    s += leaf(100, cy-5, 90, .9, LEAF[0]);
    return wrap(s);
  }
  let top = 0;
  if (days < 10){ cy = G - (100 + (days-5)*4); rx = 30; ry = 20; n = 14 + (days-5)*2; s += trunk(5,3,cy+8,"#8a7a52"); }
  else if (days < 15){
    cy = G - (118 + (days-10)*3); rx = 46; ry = 30; n = 38 + (days-10)*4;
    s += trunk(9,5,cy+14);
    s += branch(100,cy+34,100-rx*.55,cy+ry*.15,3) + branch(100,cy+42,100+rx*.55,cy+ry*.1,3);
  } else {
    cy = 74; rx = 64; ry = 42; n = 96;
    s += trunk(14,7,cy+24);
    s += branch(100,cy+52,100-rx*.6,cy+ry*.2,4.5) + branch(100,cy+60,100+rx*.62,cy+ry*.15,4.5) + branch(100,cy+36,100,cy-ry*.2,4);
  }
  const cx = 100;
  for (let i = 0; i < n; i++){
    const a = r() * Math.PI * 2, u = Math.sqrt(r());
    const x = cx + rx * u * Math.cos(a), y = cy + ry * u * Math.sin(a);
    const rot = Math.cos(a) * 30 * (y > cy ? 1 : -1) + (r()-.5) * 50;
    s += leaf(x, y, rot, days >= 15 ? 1.05 : .95, LEAF[Math.floor(r()*LEAF.length)]);
  }
  if (days >= 20){
    const cnt = Math.min(days - 19, 16), ro = rng((seed||1) * 31 + 7);
    for (let i = 0; i < cnt; i++){
      const a = Math.PI * (0.12 + ro() * 0.76), u = 0.45 + ro() * 0.45;
      const x = cx + rx * u * Math.cos(a), y = cy + ry * u * Math.sin(a) + 4;
      const ripe = Math.min(1, (cnt - 1 - i) / 10);
      s += '<ellipse cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" rx="5.2" ry="6.2" fill="'+mixHex("#9fb04f","#3d3042",ripe)+'"/>'+
           '<ellipse cx="'+(x-1.6).toFixed(1)+'" cy="'+(y-2).toFixed(1)+'" rx="1.3" ry="1.8" fill="#fff" opacity=".35"/>';
    }
  }
  return wrap(s);
}
function nextText(days){
  if (days >= 20) return "実が " + Math.min(days - 19, 16) + " 粒";
  const idx = stageOf(days), nx = STAGES[idx+1];
  if (days <= 0) return "朝に何かしたら芽が出ます";
  return "あと " + (nx[0]-days) + " 日で" + nx[1];
}

/* ===== 断捨離チャレンジ(設定は別キーに保存。日付の記録には混ぜない) ===== */
const SET_KEY = "karada-settings-v1";
let settings = {chStart: "2026-09-19", chGoal: 100};
try {
  const s = JSON.parse(localStorage.getItem(SET_KEY) || "null");
  if (s && DATE_RE.test(s.chStart || "")) settings.chStart = s.chStart;
  if (s && +s.chGoal >= 1 && +s.chGoal <= 1000) settings.chGoal = Math.floor(+s.chGoal);
} catch(e){}
function saveSettings(){ try { localStorage.setItem(SET_KEY, JSON.stringify(settings)); } catch(e){ toast("設定を保存できませんでした"); } }
function challengeInfo(){
  const start = parseYmd(settings.chStart), t = parseYmd(todayKey());
  const n = Math.round((t - start) / 86400000) + 1, goal = settings.chGoal;
  const end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + goal - 1);
  return {n: n, goal: goal, left: goal - n, end: end};
}
function challengeCard(){
  const c = challengeInfo(), endTxt = (c.end.getMonth()+1) + "/" + c.end.getDate();
  let main, sub, pct;
  if (c.n < 1){ main = '開始まで あと <b>'+(1-c.n)+'</b> 日'; sub = ''; pct = 0; }
  else if (c.left < 0){ main = '<b>'+c.goal+'日</b> 達成 🎉'; sub = c.n + '日目になりました'; pct = 100; }
  else if (c.left === 0){ main = '<b>ゴールの '+c.goal+'日目</b> 🎉'; sub = endTxt+' 達成！'; pct = 100; }
  else { main = 'あと <b>'+c.left+'</b> 日'; sub = c.n + '日目 / ' + c.goal + '日　ゴール ' + endTxt; pct = Math.max(0, Math.min(100, c.n / c.goal * 100)); }
  return '<div class="card"><h2>🌼 断捨離'+c.goal+'日チャレンジ</h2>'+
    '<div class="ch-main">'+main+'</div>'+(sub ? '<div class="ch-sub">'+sub+'</div>' : '')+
    '<div class="ch-bar"><div style="width:'+pct.toFixed(1)+'%"></div></div></div>';
}

/* ===== 睡眠 =====
   bed は「その日の起床の前に寝た時刻」。bed が wake より遅い時刻(例 23:00)なら前の晩、早い時刻(例 00:30)なら日付をまたいだ後とみなす。 */
const SLEEP_GOAL = 6;
function toMin(s){ const m = /^(\d{1,2}):(\d{2})$/.exec(s || ""); return m ? (+m[1])*60 + (+m[2]) : null; }
function sleepMinutes(r){
  if (!r) return null;
  const w = toMin(r.wake), b = toMin(r.bed);
  if (w === null || b === null) return null;
  let d = w - b; if (d < 0) d += 1440;
  return d === 0 ? null : d;
}
function fmtDur(min){ const h = Math.floor(min/60), m = min % 60; return h + "時間" + (m ? m + "分" : ""); }
function sleepInfoHTML(r){
  const m = sleepMinutes(r);
  let h = "";
  if (m === null) h += '<span class="hint">就寝と起床を入れると、睡眠時間が出ます</span>';
  else h += '<span class="sl-dur">'+fmtDur(m)+'</span>'+(m >= SLEEP_GOAL*60 ? '<span class="sl-ok">✓ '+SLEEP_GOAL+'時間以上</span>' : '');
  const gi = goalInfo();
  if (gi) h += '<div class="sl-week">今夜の目安：<b>'+fmtClock(gi.goal)+'</b> までに寝ると '+SLEEP_GOAL+'時間（最近の起床 '+fmtClock(gi.wake)+'）</div>';
  /* 直近7日(選択日まで) */
  const vals = []; const base = parseYmd(cur);
  for (let i = 0; i < 7; i++){
    const d = new Date(base); d.setDate(d.getDate() - i);
    const x = sleepMinutes(db[ymd(d)]);
    if (x !== null) vals.push(x);
  }
  if (vals.length){
    const ok = vals.filter(x => x >= SLEEP_GOAL*60).length;
    const avg = vals.reduce((a,b) => a+b, 0) / vals.length / 60;
    h += '<div class="sl-week">直近7日　'+SLEEP_GOAL+'時間以上 <b>'+ok+'日</b>（記録 '+vals.length+'日）・平均 '+avg.toFixed(1)+'時間</div>';
  }
  return h;
}

/* ===== 画面状態 ===== */
const ASA_CHOICES = ["断捨離5分","ストレッチ","読書","散歩","片付け","仕事・勉強","ゆっくり過ごした","その他"];
const PARTS = ["目","頭","首・肩","背中","腰","気分","全身のだるさ"];
const COND_LABEL = {1:"楽",2:"重め",3:"重い"};
let cur = todayKey(), tab = "home", asaOpen = false, itemOpen = false, foldOpen = false, q = "", lastToday = todayKey();
let popId = null;

/* ===== 睡眠の見える化 ===== */
const med = a => { const s = a.slice().sort((x,y) => x-y), n = s.length; return n ? (n % 2 ? s[(n-1)/2] : (s[n/2-1]+s[n/2])/2) : null; };
function fmtClock(m){ m = ((Math.round(m) % 1440) + 1440) % 1440; return Math.floor(m/60) + ":" + pad(m % 60); }
/* 就寝時刻を「0:00からの分」に。12時以降は前の晩(マイナス)。例 23:00→-60、00:30→30 */
function bedRel(r){ const b = r ? toMin(r.bed) : null; return b === null ? null : (b >= 720 ? b - 1440 : b); }
function lastDays(n){
  const out = [], base = new Date();
  for (let i = n-1; i >= 0; i--){
    const d = new Date(base.getFullYear(), base.getMonth(), base.getDate() - i), k = ymd(d), r = db[k];
    out.push({date:k, d:d, bed:bedRel(r), dur:sleepMinutes(r), wake:r ? toMin(r.wake) : null});
  }
  return out;
}
/* 6時間確保できる就寝の目安 = 最近の起床(中央値) − 6時間 */
function goalInfo(){
  const w = lastDays(14).map(x => x.wake).filter(x => x !== null);
  if (w.length < 3) return null;
  const mw = med(w);
  return {goal: Math.round((mw - SLEEP_GOAL*60) / 5) * 5, wake: mw};
}
function weekStats(list){
  const beds = list.map(x => x.bed).filter(x => x !== null), durs = list.map(x => x.dur).filter(x => x !== null);
  return {bed: med(beds), avg: durs.length ? durs.reduce((a,b) => a+b,0)/durs.length/60 : null,
          ok: durs.filter(x => x >= SLEEP_GOAL*60).length, n: durs.length};
}
const CH_W = 340, CH_H = 172, CH_L = 38, CH_R = 8, CH_T = 10, CH_B = 24;
function chAxisX(days){
  let s = "";
  days.forEach((x,i) => { if (i % 7 === 0){
    const cx = CH_L + i*(CH_W-CH_L-CH_R)/(days.length-1);
    s += '<text x="'+cx.toFixed(1)+'" y="'+(CH_H-8)+'" font-size="9" fill="#8a8670" text-anchor="middle">'+(x.d.getMonth()+1)+'/'+x.d.getDate()+'</text>';
  }});
  return s;
}
function chartBed(days, goal){
  const vals = days.map(x => x.bed).filter(x => x !== null);
  let lo = Math.min(-60, ...vals, goal === null ? 0 : goal - 30), hi = Math.max(120, ...vals, goal === null ? 0 : goal + 60);
  lo = Math.max(-300, Math.floor(lo/60)*60); hi = Math.min(300, Math.ceil(hi/60)*60);
  const Y = v => CH_T + (v-lo)/(hi-lo)*(CH_H-CH_T-CH_B);
  const X = i => CH_L + i*(CH_W-CH_L-CH_R)/(days.length-1);
  let s = '<svg viewBox="0 0 '+CH_W+' '+CH_H+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="就寝時刻の推移" style="width:100%;display:block">';
  for (let v = lo; v <= hi; v += 60)
    s += '<line x1="'+CH_L+'" x2="'+(CH_W-CH_R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="#ece4cc"/>'+
         '<text x="'+(CH_L-5)+'" y="'+(Y(v)+3).toFixed(1)+'" font-size="9" fill="#8a8670" text-anchor="end">'+fmtClock(v)+'</text>';
  if (goal !== null)
    s += '<line x1="'+CH_L+'" x2="'+(CH_W-CH_R)+'" y1="'+Y(goal).toFixed(1)+'" y2="'+Y(goal).toFixed(1)+'" stroke="#6f8f72" stroke-width="1.5" stroke-dasharray="4 3"/>'+
         '<text x="'+(CH_W-CH_R)+'" y="'+(Y(goal)-4).toFixed(1)+'" font-size="9" fill="#4d6b50" text-anchor="end">目安 '+fmtClock(goal)+'</text>';
  let path = "", prev = false;
  days.forEach((x,i) => { if (x.bed === null){ prev = false; return; } path += (prev ? "L" : "M") + X(i).toFixed(1) + " " + Y(x.bed).toFixed(1) + " "; prev = true; });
  if (path) s += '<path d="'+path+'" fill="none" stroke="#c9d6c2" stroke-width="1.5"/>';
  days.forEach((x,i) => { if (x.bed === null) return;
    s += '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(x.bed).toFixed(1)+'" r="3.2" fill="'+((goal !== null && x.bed > goal) ? "#e3b94f" : "#6f8f72")+'"/>'; });
  return s + chAxisX(days) + '</svg>';
}
function chartDur(days){
  const vals = days.map(x => x.dur).filter(x => x !== null);
  const hi = Math.max(540, Math.ceil(Math.max(0, ...vals)/180)*180);
  const Y = v => CH_H-CH_B - v/hi*(CH_H-CH_T-CH_B);
  const bw = Math.max(3, (CH_W-CH_L-CH_R)/days.length*0.62);
  let s = '<svg viewBox="0 0 '+CH_W+' '+CH_H+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="睡眠時間の推移" style="width:100%;display:block">';
  for (let v = 0; v <= hi; v += 180)
    s += '<line x1="'+CH_L+'" x2="'+(CH_W-CH_R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="#ece4cc"/>'+
         '<text x="'+(CH_L-5)+'" y="'+(Y(v)+3).toFixed(1)+'" font-size="9" fill="#8a8670" text-anchor="end">'+(v/60)+'h</text>';
  days.forEach((x,i) => { if (x.dur === null) return;
    const cx = CH_L + i*(CH_W-CH_L-CH_R)/(days.length-1);
    s += '<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+Y(x.dur).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(Y(0)-Y(x.dur)).toFixed(1)+
         '" rx="1.5" fill="'+(x.dur >= SLEEP_GOAL*60 ? "#6f8f72" : "#dccfae")+'"/>'; });
  s += '<line x1="'+CH_L+'" x2="'+(CH_W-CH_R)+'" y1="'+Y(SLEEP_GOAL*60).toFixed(1)+'" y2="'+Y(SLEEP_GOAL*60).toFixed(1)+'" stroke="#4d6b50" stroke-width="1.5" stroke-dasharray="4 3"/>'+
       '<text x="'+(CH_W-CH_R)+'" y="'+(Y(SLEEP_GOAL*60)-4).toFixed(1)+'" font-size="9" fill="#4d6b50" text-anchor="end">目標 '+SLEEP_GOAL+'時間</text>';
  return s + chAxisX(days) + '</svg>';
}
function lateNightText(){
  const cnt = [0,0,0,0,0,0,0]; let total = 0;
  dateKeys().forEach(k => {
    const b = bedRel(db[k]); if (b === null || b < 60) return;
    const d = parseYmd(k); d.setDate(d.getDate() - 1);   /* 寝た「夜」は起きた日の前日 */
    cnt[d.getDay()]++; total++;
  });
  if (total < 3) return "";
  const top = cnt.indexOf(Math.max.apply(null, cnt));
  return '1時以降に寝た夜は、記録の中で <b>'+total+'回</b>。いちばん多いのは <b>'+WD[top]+'曜の夜</b>（'+cnt[top]+'回）です。';
}
function sleepView(){
  const days = lastDays(30), g = goalInfo();
  const A = weekStats(days.slice(23)), B = weekStats(days.slice(16, 23));
  const cell = (st) => '<div><div class="sv-k">就寝（中央値）</div><div class="sv-v">'+(st.bed === null ? "—" : fmtClock(st.bed))+'</div>'+
    '<div class="sv-k">睡眠（平均）</div><div class="sv-v">'+(st.avg === null ? "—" : st.avg.toFixed(1)+'<small>時間</small>')+'</div>'+
    '<div class="sv-k">'+SLEEP_GOAL+'時間以上</div><div class="sv-v">'+st.ok+'<small>日 / 記録'+st.n+'日</small></div></div>';
  let change = "";
  if (A.bed !== null && B.bed !== null){
    const diff = Math.round(A.bed - B.bed);
    change = Math.abs(diff) < 10 ? "就寝時刻は、その前の週とほぼ同じです。" :
             diff < 0 ? "その前の週より、<b>"+(-diff)+"分 早く</b>寝られています。" : "その前の週より、"+diff+"分 遅めでした。";
  }
  if (!change && A.n === 0 && A.bed === null) change = "この1週間の記録がまだありません。入れると、ここに先週との比較が出ます。";
  const late = lateNightText();
  let h = '<h1>睡眠</h1>';
  if (days.every(x => x.bed === null && x.dur === null)) return h + '<p class="hint">ホームの「睡眠」に就寝と起床を入れると、ここにグラフが出ます。</p>';
  h += '<div class="card"><h2>直近7日と、その前の7日</h2><div class="sv-grid"><div class="sv-h">直近7日</div><div class="sv-h">その前の7日</div>'+
       cell(A)+cell(B)+'</div>'+(change ? '<div class="sv-note">'+change+'</div>' : '')+'</div>';
  h += '<div class="card"><h2>就寝時刻（上ほど早い）</h2>'+chartBed(days, g ? g.goal : null)+
       '<div class="hint" style="margin-top:6px">'+(g ? '点線は、6時間眠るための就寝の目安（最近の起床 '+fmtClock(g.wake)+' から逆算）。目安より早い日は緑、遅い日は黄色です。' : '起床も何日か入れると、6時間眠るための就寝の目安が出ます。')+'</div></div>';
  h += '<div class="card"><h2>睡眠時間</h2>'+chartDur(days)+'<div class="hint" style="margin-top:6px">緑は'+SLEEP_GOAL+'時間以上の日です。</div></div>';
  if (late) h += '<div class="card"><h2>夜更かしの傾向</h2><div style="font-size:14px">'+late+'</div></div>';
  return h;
}

const TABS = [["home","🌿","ホーム"],["list","🌼","整えた"],["forest","🌳","森"],["sleep","🌙","睡眠"],["data","💾","データ"]];
function render(){
  const app = document.getElementById("app");
  app.innerHTML = tab === "home" ? homeView() : tab === "list" ? listView() : tab === "forest" ? forestView() : tab === "sleep" ? sleepView() : dataView();
  document.getElementById("tabs").innerHTML = TABS.map(t =>
    '<button data-tab="'+t[0]+'" class="'+(tab===t[0]?"on":"")+'"><span class="e">'+t[1]+'</span>'+t[2]+'</button>').join("");
  if (tab === "home" && itemOpen){ const el = document.getElementById("itemText"); if (el) el.focus(); }
}

/* ===== 小道具 ===== */
let toastTimer = null;
function toast(msg){
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}
function copyText(text, okMsg){
  const done = () => toast(okMsg || "コピーしました");
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand("copy"); done(); } catch(e){ toast("コピーできませんでした。手動で選んでコピーしてください"); }
  document.body.removeChild(ta);
}
function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function shiftDay(n){ const d = parseYmd(cur); d.setDate(d.getDate()+n); const k = ymd(d); if (k <= todayKey()) cur = k; }

/* ===== 操作 ===== */
document.addEventListener("click", e => {
  const tb = e.target.closest("[data-tab]");
  if (tb){ tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  switch (act){
    case "prev": shiftDay(-1); asaOpen = false; render(); break;
    case "next": shiftDay(1); asaOpen = false; render(); break;
    case "asa-open": asaOpen = true; render(); break;
    case "asa-close": asaOpen = false; render(); break;
    case "asa-pick": {
      const noteEl = document.getElementById("asaNote");
      const note = noteEl ? noteEl.value.trim() : "";
      if (edit(cur, r => { r.asa = {what: el.dataset.v, note: note, at: Date.now()}; })){ asaOpen = false; render(); toast("🌿 木が育ちました"); }
      break;
    }
    case "asa-undo":
      if (confirm("この日の朝活の記録を取り消しますか？")){ edit(cur, r => { delete r.asa; }); render(); }
      break;
    case "item-open": itemOpen = true; render(); break;
    case "item-close": itemOpen = false; render(); break;
    case "item-add": addItem(); break;
    case "item-del":
      if (confirm("この記録を削除しますか？")){ edit(cur, r => { r.items = (r.items||[]).filter(i => i.id !== el.dataset.id); if (!r.items.length) delete r.items; }); render(); }
      break;
    case "list-del":
      if (confirm("この記録を削除しますか？")){
        const dt = el.dataset.date;
        edit(dt, r => { r.items = (r.items||[]).filter(i => i.id !== el.dataset.id); if (!r.items.length) delete r.items; });
        render();
      }
      break;
    case "cond": {
      const k = el.dataset.k, v = +el.dataset.v;
      edit(cur, r => { if (r[k] === v) delete r[k]; else r[k] = v; });
      render(); break;
    }
    case "part": {
      const v = el.dataset.v;
      edit(cur, r => {
        const a = Array.isArray(r.parts) ? r.parts.slice() : [];
        const i = a.indexOf(v); if (i >= 0) a.splice(i,1); else a.push(v);
        r.parts = a;
      });
      render(); break;
    }
    case "copy-month": {
      const mk = el.dataset.mk;
      const lines = allItems().filter(i => i.date.startsWith(mk) && i.t).map(i => "・" + i.t);
      copyText(lines.length ? lines.join("\n") : "", lines.length ? lines.length + "件コピーしました" : "コピーする名前がありません");
      break;
    }
    case "copy-all": copyText(JSON.stringify(db)); break;
    case "import": importData(); break;
  }
});

function addItem(){
  const el = document.getElementById("itemText");
  const t = el ? el.value.trim() : "";
  const id = newId();
  if (edit(cur, r => { (r.items = Array.isArray(r.items) ? r.items : []).push({id: id, t: t, at: Date.now()}); })){
    popId = id; render(); toast("🌼 ひとつ整えました");
  }
}

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target && e.target.id === "itemText"){ e.preventDefault(); addItem(); }
});
document.addEventListener("input", e => {
  if (e.target && e.target.id === "q"){ q = e.target.value; document.getElementById("listBox").innerHTML = listHTML(); }
});
document.addEventListener("change", e => {
  const id = e.target && e.target.id;
  if (id === "asaNoteEdit"){
    edit(cur, r => { if (r.asa) r.asa.note = e.target.value.trim(); });
  } else if (id === "wake" || id === "bed"){
    edit(cur, r => { r[id] = e.target.value || ""; });
    const si = document.getElementById("sleepInfo"); if (si) si.innerHTML = sleepInfoHTML(db[cur]);
  } else if (id === "memo"){
    edit(cur, r => { r.memo = e.target.value; });
  } else if (id === "chStart"){
    if (DATE_RE.test(e.target.value)){ settings.chStart = e.target.value; saveSettings(); toast("開始日を変えました"); }
    else e.target.value = settings.chStart;
  } else if (id === "chGoal"){
    const v = Math.floor(+e.target.value);
    if (v >= 1 && v <= 1000){ settings.chGoal = v; saveSettings(); toast("目標日数を変えました"); }
    else e.target.value = settings.chGoal;
  }
});
document.addEventListener("toggle", e => { if (e.target && e.target.id === "fold") foldOpen = e.target.open; }, true);

function importData(){
  const el = document.getElementById("imp"); const text = el ? el.value.trim() : "";
  if (!text){ toast("JSONを貼ってください"); return; }
  let o;
  try { o = JSON.parse(text); if (!o || typeof o !== "object" || Array.isArray(o)) throw 0; }
  catch(e){ toast("JSONを読み取れませんでした"); return; }
  if (!canSave){ toast(loadErr); return; }
  let added = 0;
  Object.keys(o).forEach(k => { if (DATE_RE.test(k) && o[k] && typeof o[k] === "object" && !db[k]){ db[k] = o[k]; added++; } });
  if (added){ save(); toast(added + "日分を追加しました"); } else toast("追加する日はありませんでした");
  render();
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible"){
    const t = todayKey();
    if (t !== lastToday){ if (cur === lastToday) cur = t; lastToday = t; }
    const ae = document.activeElement;
    if (!ae || ae === document.body) render();
  }
});

render();
</script>
</body>
</html>
